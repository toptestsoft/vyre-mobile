name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK (Split Per ABI)
        run: flutter build apk --release --build-name=${{ github.ref_name }} --split-per-abi

      - name: Calculate SHA256 checksum
        run: |
          SHA=$(sha256sum build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | cut -d' ' -f1)
          echo "SHA256=${SHA}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x64-v8a-release.apk

      - name: Generate Appcast
        env:
          SHA256: ${{ env.SHA256 }}
        run: |
          python3 scripts/generate_appcast.py ${{ github.ref_name }}

      - name: Commit and Push Appcast
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add appcast.xml
          git commit -m "Update appcast for ${{ github.ref_name }}" || echo "No changes to appcast"
          git push
