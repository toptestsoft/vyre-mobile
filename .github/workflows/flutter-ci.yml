name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter analyze

  test:
    name: flutter test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - run: flutter pub get
      - run: flutter test

  build:
    name: build APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: 'stable'

      - name: Setup temporary CI keystore
        run: |
          mkdir -p android/app
          keytool -genkeypair \
            -alias ci-alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore android/app/keystore.jks \
            -storepass ci-password \
            -keypass ci-password \
            -dname "CN=VYRE CI" \
            -noprompt
          cat > android/key.properties << 'EOF'
          storePassword=ci-password
          keyPassword=ci-password
          keyAlias=ci-alias
          storeFile=keystore.jks
          EOF

      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
